server.port=${PORT:8080}

spring.application.name=stroy

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stroy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger / OpenAPI sozlamalari
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Email sozlamalari (ixtiyoriy):
# SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
# SPRING_MAIL_USERNAME=...         SPRING_MAIL_PASSWORD=...
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
# va MAIL_ENABLED=true, MAIL_TO=admin@example.com

# Kamida 32 belgi. Productionda JWT_SECRET muhit o'zgaruvchisi bilan almashtiring!
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-min-32-chars-long-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
app.admin.email=${ADMIN_EMAIL:originalorig31@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:originalorig31@gmail.com}
app.mail.to=${MAIL_TO:}